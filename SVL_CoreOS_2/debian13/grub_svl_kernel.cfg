# SVL CoreOS 2: Apex — Parametry rozruchowe GRUB dla w pełni odblokowanego jądra Debian 13 (Bare-Metal)
# Instalacja: /etc/default/grub.d/99-svl-kernel.cfg (następnie: update-grub)
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} systemd.unified_cgroup_hierarchy=1 transparent_hugepage=madvise nvme_core.default_ps_max_latency_us=0 pcie_aspm=performance mitigations=off iommu=pt apparmor=0"
