# SVL CoreOS 2: Apex — Debian 13 (Trixie) Linux 6.12 LTS Bare-Metal Kernel Tuning (W PEŁNI ODBLOKOWANY)
# Tryb: Standalone Bare-Metal · Pełny dostęp ROOT do jądra, eBPF, perf, kexec, dmesg i ptrace (Jyn Mitek & Flota AI)

# --- Pełne odblokowanie podsystemów jądra dla ROOT / Jyn Mitek / Floty AI ---
kernel.sysrq = 1
kernel.yama.ptrace_scope = 0
kernel.unprivileged_bpf_disabled = 0
kernel.kptr_restrict = 0
kernel.dmesg_restrict = 0
kernel.perf_event_paranoid = -1
kernel.kexec_load_disabled = 0
kernel.modules_disabled = 0
kernel.randomize_va_space = 2

# --- Sieć: BBR, kolejkowanie fq, szybki TCP i maksymalna przepustowość ---
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.core.bpf_jit_enable = 1
net.core.bpf_jit_harden = 0
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.core.somaxconn = 8192
net.core.netdev_max_backlog = 16384
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_probes = 5
net.ipv4.tcp_keepalive_intvl = 15
net.ipv4.tcp_syncookies = 1
net.ipv4.ip_forward = 1
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1

# --- Pamięć, SQLite WAL i obciążenia AI/Ollama ---
vm.swappiness = 10
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5
vm.vfs_cache_pressure = 50
vm.max_map_count = 1048576

# --- Deskryptory, asynchroniczne I/O, zrzuty diagnostyczne i watchery ---
fs.file-max = 2097152
fs.aio-max-nr = 1048576
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
fs.suid_dumpable = 1
