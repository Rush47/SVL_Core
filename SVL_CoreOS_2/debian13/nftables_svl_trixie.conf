#!/usr/sbin/nft -f
# ==============================================================================
# SVL CoreOS 2: Apex — Zapora Ogniowa nftables dla Debian 13 (Trixie)
# Lokalizacja docelowa: /etc/nftables.conf (usługa systemd: nftables.service)
# Polityka: Zero-Trust Inbound · Izolacja portów jądra Python (8085) i Ollama (11434)
# ==============================================================================

flush ruleset

table inet svl_apex_filter {
    set trusted_loopback {
        type ipv4_addr
        elements = { 127.0.0.1 }
    }

    chain input {
        type filter hook input priority filter; policy drop;

        # 1. Ruch lokalny (loopback: brama Express <-> jądro Python 8085 <-> Ollama 11434 <-> JEDI VM 8443)
        iifname "lo" accept

        # 2. Połączenia nawiązane i powiązane
        ct state established,related accept
        ct state invalid drop

        # 3. Diagnostyka ICMP / ICMPv6 (z limitem przepustowości)
        ip protocol icmp limit rate 10/second accept
        ip6 nexthdr icmpv6 limit rate 10/second accept

        # 4. SSH oraz kanał QKD Mesh SVL-364 (z ochroną brute-force)
        tcp dport { 22, 2222 } ct state new limit rate 15/minute accept

        # 5. Brama webowa SVL CoreOS 2 (HTTP/WebSocket port 3000)
        tcp dport 3000 accept

        # 6. Podwójny tunel WireGuard VPN (UDP 51820)
        udp dport 51820 accept

        # 7. Bezpośredni dostęp z zewnątrz do portów 8085 (Python) i 11434 (Ollama) jest ZABLOKOWANY
        tcp dport { 8085, 11434 } ip saddr != 127.0.0.1 drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        iifname "wg*" accept
        oifname "wg*" ct state established,related accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
