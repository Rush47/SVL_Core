name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalacja zależności
        run: |
          npm ci
          pip install -r backend/requirements.txt
      - name: Typy TypeScript
        run: npx tsc --noEmit
      - name: Testy TypeScript
        run: npm run test:unit
      - name: Testy Pythona
        run: npm run test:python
      - name: Build frontendu
        run: npx vite build
