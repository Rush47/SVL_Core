# Automatyczny przegląd każdego pull requesta przez Claude (subskrypcja Claude).
# Sekret repozytorium: CLAUDE_CODE_OAUTH_TOKEN (utwórz poleceniem `claude setup-token`).
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Przejrzyj pull request #${{ github.event.pull_request.number }} w ${{ github.repository }}.
            Szukaj błędów działania, problemów bezpieczeństwa (sekrety, wstrzyknięcia, uprawnienia)
            i naruszeń zasad z CLAUDE.md. Pisz po polsku. Uwagi do konkretnych linii dodaj jako
            komentarze w kodzie, a krótkie podsumowanie jako komentarz do PR.
          claude_args: |
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
